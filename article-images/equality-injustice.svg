<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" dir="rtl">
  <rect width="800" height="400" fill="#1a1a2e" rx="16"/>
  
  <!-- Title -->
  <text x="400" y="50" text-anchor="middle" font-family="Noto Sans Arabic, Arial" font-size="24" font-weight="bold" fill="#e8e8e8">مساواة في الظلم</text>
  <text x="400" y="78" text-anchor="middle" font-family="Noto Sans Arabic, Arial" font-size="14" fill="#aaa">إلهام عيدروس، الناشطة النسوية</text>
  
  <!-- Two sides -->
  <!-- Left: Mother -->
  <rect x="30" y="110" width="340" height="130" rx="12" fill="#16213e" stroke="#e94560" stroke-width="2"/>
  <text x="200" y="140" text-anchor="middle" font-family="Noto Sans Arabic, Arial" font-size="16" font-weight="bold" fill="#e94560">👩 الأم الحاضنة</text>
  <text x="200" y="168" text-anchor="middle" font-family="Noto Sans Arabic, Arial" font-size="12" fill="#ccc">تتزوج → تخسر الحضانة عند 7 سنوات</text>
  <text x="200" y="190" text-anchor="middle" font-family="Noto Sans Arabic, Arial" font-size="12" fill="#ccc">حتى لو كان الأب متزوجاً بأخرى</text>
  <text x="200" y="215" text-anchor="middle" font-family="Noto Sans Arabic, Arial" font-size="12" fill="#e94560">"كيف تسمح الدولة بالزواج المختلط</text>
  <text x="200" y="232" text-anchor="middle" font-family="Noto Sans Arabic, Arial" font-size="12" fill="#e94560">ثم تحرم الأم من الحضانة لنفس السبب؟"</text>
  
  <!-- Right: Father -->
  <rect x="430" y="110" width="340" height="130" rx="12" fill="#16213e" stroke="#0f3460" stroke-width="2"/>
  <text x="600" y="140" text-anchor="middle" font-family="Noto Sans Arabic, Arial" font-size="16" font-weight="bold" fill="#4da6ff">👨 الأب الحاضن</text>
  <text x="600" y="168" text-anchor="middle" font-family="Noto Sans Arabic, Arial" font-size="12" fill="#ccc">يتزوج → يخسر الحضانة أيضاً!</text>
  <text x="600" y="190" text-anchor="middle" font-family="Noto Sans Arabic, Arial" font-size="12" fill="#ccc">نفس العقوبة تطبق على الأب</text>
  <text x="600" y="215" text-anchor="middle" font-family="Noto Sans Arabic, Arial" font-size="12" fill="#4da6ff">"بدلاً من معالجة مشكلة زواج الأم،</text>
  <text x="600" y="232" text-anchor="middle" font-family="Noto Sans Arabic, Arial" font-size="12" fill="#4da6ff">حظروا الزواج على الوالدين معاً"</text>
  
  <!-- Center arrow -->
  <line x1="390" y1="150" x2="410" y2="150" stroke="#e94560" stroke-width="3"/>
  <line x1="390" y1="190" x2="410" y2="190" stroke="#0f3460" stroke-width="3"/>
  <text x="400" y="175" text-anchor="middle" font-family="Noto Sans Arabic, Arial" font-size="16" fill="#ffd700">⚖️</text>
  
  <!-- Bottom summary -->
  <rect x="80" y="270" width="640" height="100" rx="12" fill="#e94560" opacity="0.15" stroke="#e94560" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="400" y="300" text-anchor="middle" font-family="Noto Sans Arabic, Arial" font-size="14" font-weight="bold" fill="#e94560">"حل يزيد المشاكل أكثر مما يحلها"</text>
  <text x="400" y="325" text-anchor="middle" font-family="Noto Sans Arabic, Arial" font-size="12" fill="#ccc">النص بدلاً من أن يعالج جذور المشكلة، يوسع نطاق العقوبات على الطرفين معاً</text>
  <text x="400" y="350" text-anchor="middle" font-family="Noto Sans Arabic, Arial" font-size="11" fill="#888">نتيجة: أمهات يلجأن للزواج العرفي → مشاكل قانونية أعقد → الأطفال يدفعون الثمن</text>
</svg>